<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page that shows the transactions in the account.">
    <meta name="author" content="Simon Taunima">
    <title>Fiscal Focus - Transaction Page</title>
    <link rel="stylesheet" href="fiscal_focus.css">
    <script src="fiscal_focus.js" defer></script>
</head>
<body>
    <header>
        <h1>Fiscal Focus</h1>
        <nav>
            <ul>
                <li><a href="fiscal_home.html">Home</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="account-detail">
            <h2 id="account-name"></h2>
            <!-- The account that is being viewed. -->
        </div>
        <button onclick="showForm('transaction-form')"> Add Transaction </button>
        <div id="transaction-form" style="display:none">
            <input type="date" id="transaction-date">
            <input type="text" id="transaction-name" placeholder="Name">
            <input type="number" id="transaction-amount" placeholder="Amount">
            <select id="transaction-type">
                <option value="deposit"> Deposit </option>
                <option value="withdrawal"> Withdrawal </option>
            </select>
            <select id="category-type">
            </select>
            <button onclick="addTransaction()"> Submit </button>
        </div>
        <section id="transactions-container">
            <h2>Transactions:</h2>
            <!-- The entire transaction history. -->
        </section>
    </main>
</body>
</html>
